<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Contact Form</title>
<style>
  :root {
    --bg: #f3f5f7;
    --panel: #ffffff;
    --ink: #1c2530;
    --muted: #65727f;
    --line: #d5dce3;
    --accent: #1f6f78;
    --accent-ink: #ffffff;
    --warn: #b4472f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a20;
      --panel: #1d252d;
      --ink: #e8edf1;
      --muted: #9aa7b3;
      --line: #33404b;
      --accent: #4fb3bf;
      --accent-ink: #0f1a1d;
      --warn: #e58a72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.55;
    padding: 32px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 6px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--panel); border: 1px solid var(--line); padding: 24px; border-radius: 6px; }
  label { display: block; font-weight: bold; margin: 0 0 4px; font-size: .95rem; }
  input, textarea {
    width: 100%; padding: 10px 12px; margin-bottom: 16px;
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px;
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea { min-height: 120px; resize: vertical; }
  button {
    font: inherit; font-weight: bold; padding: 11px 20px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #result { margin-top: 24px; display: none; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 18px 20px; border-radius: 6px; }
  #result.error { border-left-color: var(--warn); }
  #result h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .tag { display: inline-block; font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
  #reply { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Get in touch</h1>
  <p class="lead">Send a message and get an instant reply written by AI.</p>

  <form id="contact-form">
    <label for="name">Your name</label>
    <input id="name" name="name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button id="send" type="submit">Send message</button>
  </form>

  <section id="result" aria-live="polite">
    <h2 id="result-title"></h2>
    <div class="tag" id="result-tag"></div>
    <p id="reply"></p>
  </section>
</main>

<script>
  // Paste your n8n webhook URL here.
  // Use the Test URL while building, then switch to the Production URL.
  const WEBHOOK_URL = "http://localhost:5678/webhook-test/contact";;

  const form = document.getElementById("contact-form");
  const sendBtn = document.getElementById("send");
  const box = document.getElementById("result");

  function show(title, tag, text, isError) {
    box.style.display = "block";
    box.classList.toggle("error", !!isError);
    document.getElementById("result-title").textContent = title;
    document.getElementById("result-tag").textContent = tag;
    document.getElementById("reply").textContent = text;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    const payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      message: form.message.value.trim()
    };

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      show(
        "Reply",
        "Category: " + (data.category || "general"),
        data.suggested_reply || "Thanks, we received your message."
      );
      form.reset();
    } catch (err) {
      show("Message not sent", "", "Check that the workflow is running and the webhook URL is correct. (" + err.message + ")", true);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send message";
    }
  });
</script>
</body>
</html>
